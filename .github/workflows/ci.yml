name: CI

on:
   push: # Runs on push to any branch
   pull_request:
      branches: [ "master" ]

env:
   CARGO_TERM_COLOR: always

jobs:
   standards:
      name: Standards and checks
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version-file: '.nvmrc'
              cache: 'npm'

         - name: Install system dependencies
           run: |
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              components: rustfmt, clippy
              cache: true

         - name: Install npm dependencies
           run: npm ci

         - name: Verify Android Gradle contract
           run: npm run verify:android-gradle

         - name: Run standards checks
           run: |
             # Determine commitlint range
             if [ "${{ github.event_name }}" = "pull_request" ]; then
                export COMMITLINT_FROM="${{ github.event.pull_request.base.sha }}"
             else
                # For pushes, verify the before commit exists
                if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
                   export COMMITLINT_FROM="${{ github.event.before }}"
                else
                   # Fallback: check only HEAD commit on force push or first push
                   export COMMITLINT_FROM="HEAD~1"
                fi
             fi
             npm run standards

         - name: Run cargo check
           run: cargo check --workspace --all-targets

         - name: Run TypeScript tests
           run: npm run test:ts

         - name: Run Rust tests
           run: cargo test -p fs-resolver --lib

   android-plugin-build:
      name: Android Plugin Build
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Java
           uses: actions/setup-java@v4
           with:
              distribution: 'temurin'
              java-version: '17'
              cache: 'gradle'

         - name: Setup Android SDK
           uses: android-actions/setup-android@v3
           with:
              # v3 default is `tools platform-tools`; Google removed `tools` from the SDK repo.
              packages: 'platform-tools'

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              target: aarch64-linux-android
              cache: true

         - name: Add Android target
           run: rustup target add aarch64-linux-android

         - name: Populate android/.tauri/tauri-api
           run: cargo build -p tauri-plugin-fs-resolver --target aarch64-linux-android

         - name: Assemble plugin AAR
           working-directory: android
           run: ./gradlew assembleDebug

   # These tests are only run on macOS and Windows because they require native
   # dependencies.
   # Tests for Linux-specific features are run in the `standards` job, since the build
   # agents themeselves are Linux-based.
   platform-specific-rust-tests:
      name: Platform-specific Rust tests (${{ matrix.os }})
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            os: [macos-latest, windows-latest]

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              components: clippy
              cache: true

         - name: Run Rust tests
           run: cargo test -p fs-resolver --lib

         # `!cancelled()` so a failing test does not hide a lint break. Every Apple-gated
         # path is cfg'd out on ubuntu, so both crates that have one are linted here.
         - name: Lint platform-specific Rust
           if: ${{ !cancelled() }}
           run: cargo clippy -p fs-resolver -p tauri-plugin-fs-resolver --all-targets --all-features -- -D warnings

         # iOS cannot run here -- no simulator test harness -- but it can be linted, and
         # nothing else in CI checks an iOS code path. Scoped to fs-resolver: the plugin
         # and example crates need Tauri's iOS scaffolding.
         - name: Add iOS target
           if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
           run: rustup target add aarch64-apple-ios

         - name: Lint iOS build
           if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
           run: cargo clippy -p fs-resolver --target aarch64-apple-ios --all-features --all-targets -- -D warnings
